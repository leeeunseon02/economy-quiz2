<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 · 경제 퀴즈</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{width:min(1100px,calc(100% - 28px));margin:32px auto 70px}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}.admin-head h1{margin:0}.admin-note{padding:14px 16px;border-radius:12px;background:#eef3ff;color:#263d81;margin:12px 0 22px}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.admin-card{padding:22px;min-width:0}.admin-card h2{font-size:20px;margin:0 0 14px}.admin-label{display:block;font-weight:750;margin:12px 0 5px}.admin-input,.admin-textarea,.admin-select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:white;font:inherit;color:var(--text)}.admin-textarea{min-height:84px;resize:vertical}.admin-textarea.tall{min-height:130px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.admin-actions button,.mini-btn{border:0;border-radius:9px;padding:9px 13px;font-weight:750}.admin-actions .save{background:var(--primary);color:#fff}.admin-actions .clear{background:#eef0f5;color:#344054}.admin-list{display:grid;gap:8px;margin-top:16px}.admin-item{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.admin-item strong{display:block;overflow-wrap:anywhere}.admin-item small{display:block;color:var(--muted);overflow-wrap:anywhere}.mini-btn{padding:6px 9px;background:#eef0f5;margin-left:4px}.mini-btn.delete{background:#fff0f0;color:#b42318}.admin-status{min-height:24px;color:var(--muted);font-size:14px}.admin-section{margin:22px 0}.admin-section .admin-card{margin-bottom:16px}.hidden{display:none!important}@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-card{padding:17px}}
</style></head><body>
<header class="topbar"><a href="index.html" class="brand" style="text-decoration:none;color:inherit">📚 경제 퀴즈</a><a href="index.html" style="text-decoration:none;color:#315efb;font-weight:800">학습 사이트로 돌아가기</a></header>
<main class="admin-wrap"><div class="admin-head"><div><span class="eyebrow">ADMIN PANEL</span><h1>학습 콘텐츠 관리</h1><p style="color:var(--muted);margin:4px 0">카테고리 → 개념 → 문제 순서로 추가하세요.</p></div><button class="secondary-btn" id="logoutBtn">로그아웃</button></div>
<div id="status" class="admin-status">로그인 및 관리자 권한을 확인하는 중...</div><div id="adminApp" class="hidden">
<div class="admin-note">저장한 내용은 Supabase 데이터베이스에 저장되며, 학습 사이트에 자동 반영됩니다. 문제 보기는 한 줄에 하나씩 입력하세요. 정답 번호는 1~4번입니다.</div>
<section class="admin-section"><div class="admin-grid">
<div class="admin-card card"><h2>① 카테고리 추가 / 수정</h2><form id="categoryForm"><input id="categoryId" type="hidden"><label class="admin-label" for="categoryName">카테고리 이름 *</label><input class="admin-input" id="categoryName" required placeholder="예: 경제 기초"><label class="admin-label" for="categoryIcon">아이콘</label><input class="admin-input" id="categoryIcon" value="📘" maxlength="12"><label class="admin-label" for="categoryDescription">설명</label><textarea class="admin-textarea" id="categoryDescription" placeholder="카테고리 소개"></textarea><label class="admin-label" for="categoryOrder">표시 순서</label><input class="admin-input" id="categoryOrder" type="number" value="0"><div class="admin-actions"><button class="save" type="submit">카테고리 저장</button><button class="clear" type="button" id="categoryClear">새로 입력</button></div></form><div id="categoryList" class="admin-list"></div></div>
<div class="admin-card card"><h2>② 개념 추가 / 수정</h2><form id="conceptForm"><input id="conceptId" type="hidden"><label class="admin-label" for="conceptCategory">소속 카테고리 *</label><select class="admin-select" id="conceptCategory" required></select><label class="admin-label" for="conceptTitle">개념 제목 *</label><input class="admin-input" id="conceptTitle" required placeholder="예: 기회비용"><label class="admin-label" for="conceptSummary">한 줄 요약</label><input class="admin-input" id="conceptSummary" placeholder="개념을 짧게 요약"><label class="admin-label" for="conceptDescription">상세 설명</label><textarea class="admin-textarea tall" id="conceptDescription" placeholder="개념 설명을 입력하세요"></textarea><label class="admin-label" for="conceptPoints">핵심 포인트 (한 줄에 하나씩)</label><textarea class="admin-textarea" id="conceptPoints" placeholder="선택에는 포기한 대안이 따릅니다.&#10;기회비용은 포기한 대안 중 가장 가치가 큰 것입니다."></textarea><label class="admin-label" for="conceptOrder">표시 순서</label><input class="admin-input" id="conceptOrder" type="number" value="0"><div class="admin-actions"><button class="save" type="submit">개념 저장</button><button class="clear" type="button" id="conceptClear">새로 입력</button></div></form><div id="conceptListAdmin" class="admin-list"></div></div>
</div></section>
<section class="admin-section"><div class="admin-card card"><h2>③ 객관식 문제 추가 / 수정</h2><form id="questionForm"><input id="questionId" type="hidden"><label class="admin-label" for="questionConcept">소속 개념 *</label><select class="admin-select" id="questionConcept" required></select><label class="admin-label" for="questionTextAdmin">문제 *</label><textarea class="admin-textarea" id="questionTextAdmin" required placeholder="문제를 입력하세요"></textarea><div class="admin-grid"><div><label class="admin-label" for="questionOptions">보기 (한 줄에 하나씩, 4개) *</label><textarea class="admin-textarea tall" id="questionOptions" required placeholder="첫 번째 보기&#10;두 번째 보기&#10;세 번째 보기&#10;네 번째 보기"></textarea></div><div><label class="admin-label" for="questionAnswer">정답 번호 *</label><select class="admin-select" id="questionAnswer" required><option value="1">1번</option><option value="2">2번</option><option value="3">3번</option><option value="4">4번</option></select><label class="admin-label" for="questionExplanation">해설</label><textarea class="admin-textarea tall" id="questionExplanation" placeholder="정답의 이유를 설명하세요"></textarea><label class="admin-label" for="questionPoints">문제 배점 *</label><input class="admin-input" id="questionPoints" type="number" min="1" max="100" step="1" value="1" required><small class="muted-note">정답이면 이 점수를 획득합니다. 결과는 총 배점 기준 100점으로 환산됩니다.</small><label class="admin-label" for="questionOrder">표시 순서</label><input class="admin-input" id="questionOrder" type="number" value="0"></div></div><div class="admin-actions"><button class="save" type="submit">문제 저장</button><button class="clear" type="button" id="questionClear">새로 입력</button></div></form><div id="questionListAdmin" class="admin-list"></div></div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
