<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 경제 퀴즈</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-wrap{width:min(480px,calc(100% - 32px));margin:48px auto 72px}
.auth-card{padding:32px}
.auth-card h1{margin:4px 0 8px;font-size:30px}
.auth-subtitle{color:var(--muted);margin:0 0 24px}
.auth-label{display:block;font-weight:700;margin:16px 0 6px}
.auth-input{display:block;width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;font:inherit;background:#fff;color:var(--text)}
.auth-input:focus{outline:2px solid #cbd5ff;border-color:var(--primary)}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 12px}
.auth-actions button{width:100%}
.auth-message{min-height:24px;margin:14px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.auth-note{font-size:13px;color:var(--muted);margin-top:18px}
.auth-back{display:inline-block;margin-top:18px;text-decoration:none;color:var(--primary);font-weight:800}
#signedInPanel{display:none}
@media(max-width:480px){.auth-card{padding:24px}}
</style>
</head>
<body>
<header class="topbar"><a href="index.html" class="brand" style="text-decoration:none;color:inherit">📚 경제 퀴즈</a><a href="index.html" style="text-decoration:none;color:#315efb;font-weight:800;font-size:14px">학습으로 돌아가기</a></header>
<main class="auth-wrap">
  <section class="auth-card card" id="authPanel">
    <span class="eyebrow">YOUR ACCOUNT</span>
    <h1 id="formTitle">로그인</h1>
    <p class="auth-subtitle" id="formSubtitle">계정에 로그인하고 학습을 이어가세요.</p>
    <form id="authForm">
      <div id="displayNameWrap" style="display:none"><label class="auth-label" for="displayName">계정 이름</label><input class="auth-input" id="displayName" type="text" autocomplete="nickname" maxlength="30" placeholder="사이트에서 표시할 이름"></div>
      <label class="auth-label" for="email">이메일</label>
      <input class="auth-input" id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
      <label class="auth-label" for="password">비밀번호</label>
      <input class="auth-input" id="password" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상" required>
      <div class="auth-actions">
        <button class="primary-btn" type="submit" id="submitBtn">로그인</button>
        <button class="secondary-btn" type="button" id="toggleBtn">회원가입</button>
      </div>
    </form>
    <p class="auth-message" id="message" role="status" aria-live="polite"></p>
    <p class="auth-note">회원가입 후 이메일 확인을 요청받을 수 있어요. 확인 메일의 링크를 눌러 가입을 완료하세요.</p>
  </section>
  <section class="auth-card card" id="signedInPanel">
    <span class="eyebrow">SIGNED IN</span>
    <h1>로그인되어 있어요.</h1>
    <p class="auth-subtitle" id="userEmail"></p>
    <button class="primary-btn full-btn" id="logoutBtn" type="button">로그아웃</button>
    <a class="auth-back" href="index.html">← 경제 퀴즈 학습으로 돌아가기</a>
    <p class="auth-message" id="signedMessage" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</body>
</html>
