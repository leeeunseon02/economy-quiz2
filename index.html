<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경제 퀴즈 학습</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">📚 경제 퀴즈</div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end"><div id="progressText"></div><a id="accountLink" href="login.html" style="visibility:hidden;text-decoration:none;color:#315efb;font-weight:800;font-size:14px">계정 확인 중...</a><button id="headerLogoutBtn" type="button" style="display:none;border:1px solid #d7deea;background:#fff;color:#344054;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer">로그아웃</button></div>
</header>
<main class="container">

<section id="homeScreen" class="screen active">
  <div class="hero card">
    <span class="eyebrow">ECONOMICS QUIZ</span>
    <h1>개념을 배우고<br>문제로 확인해보세요.</h1>
    <p>카테고리를 선택하면 먼저 핵심 개념을 공부한 뒤 문제를 풀 수 있습니다.</p>
    <button class="primary-btn" onclick="showCategories()">학습 시작하기</button>
  </div>
</section>

<section id="categoryScreen" class="screen">
  <div class="section-heading"><span class="eyebrow">STEP 1</span><h2>카테고리를 선택하세요</h2><p>공부하고 싶은 경제 분야를 골라보세요.</p></div>
  <div id="categoryList" class="category-grid"></div>
  <button class="text-btn" onclick="goHome()">← 처음으로</button>
</section>

<section id="conceptListScreen" class="screen">
  <div class="section-heading"><span class="eyebrow">STEP 2</span><h2 id="conceptCategoryTitle"></h2><p>문제를 풀기 전에 개념을 먼저 학습합니다.</p></div>
  <div id="conceptList" class="concept-list"></div>
  <button class="text-btn" onclick="showCategories()">← 카테고리로</button>
</section>

<section id="conceptScreen" class="screen">
  <div class="section-heading"><span class="eyebrow">STEP 3 · CONCEPT</span><h2 id="conceptTitle"></h2><p id="conceptSummary"></p></div>
  <article class="concept-card card">
    <h3>📖 개념 설명</h3>
    <div id="conceptDescription" class="concept-description"></div>
    <div class="keypoint-box"><h3>⭐ 핵심 포인트</h3><ul id="keyPoints"></ul></div>
  </article>
  <button class="primary-btn full-btn" onclick="startQuestions()">개념을 이해했어요 → 문제 풀기</button>
  <button class="text-btn" onclick="showConceptList()">← 개념 목록으로</button>
</section>

<section id="quizScreen" class="screen">
  <div class="quiz-meta"><span id="questionNumber"></span><span id="scoreText">점수 0</span></div>
  <div class="question-card card"><h2 id="questionText"></h2><div id="options" class="options"></div></div>
  <div id="answerBox" class="answer-box hidden">
    <div id="answerResult" class="answer-result"></div>
    <p id="answerExplanation"></p>
    <button id="nextButton" class="primary-btn full-btn" onclick="nextQuestion()">다음 문제 →</button>
  </div>
</section>

<section id="resultScreen" class="screen">
  <div class="result-card card">
    <span class="eyebrow">LEARNING COMPLETE</span>
    <h2>학습이 끝났습니다! 🎉</h2>
    <div id="resultScore" class="result-score"></div>
    <p id="resultMessage"></p>
    <div class="result-actions">
      <button class="primary-btn" onclick="retryConcept()">이 개념 다시 풀기</button>
      <button class="secondary-btn" onclick="showConceptList()">다른 개념 선택</button>
      <button class="text-btn" onclick="showCategories()">다른 카테고리</button>
    </div>
  </div>
</section>

</main>
<script src="questions.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="header-auth.js"></script>
</body>
</html>
